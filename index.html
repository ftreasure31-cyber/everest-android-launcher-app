<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EVEREST</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b1d24;--panel:#e9f3f0;--ink:#0d2a30;--mute:#5d7a80;--acc:#ff6b5a;--card:#ffffffcc;--sea:#7fd1b9;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="dark"]{--panel:#10262d;--ink:#e6f4f0;--mute:#8fb0b0;--card:#1b3a43cc}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--panel:#10262d;--ink:#e6f4f0;--mute:#8fb0b0;--card:#1b3a43cc}}
*{box-sizing:border-box;margin:0;font-family:'Bricolage Grotesque',system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);display:flex;align-items:center;justify-content:center;color:var(--ink)}
#phone{position:relative;width:390px;height:min(820px,100%);border-radius:44px;overflow:hidden;background:#000;box-shadow:0 0 0 10px #1c3640,0 30px 80px #0008}
@media(max-width:500px){#phone{width:100%;height:100%;border-radius:0;box-shadow:none}}
.wall{position:absolute;inset:0;background:var(--w);transition:background .5s}
.layer{position:absolute;inset:0;display:flex;flex-direction:column}
#status{position:absolute;top:0;left:0;right:0;height:38px;display:flex;justify-content:space-between;align-items:center;padding:0 24px;font-size:14px;font-weight:600;color:#fff;z-index:50;cursor:pointer;text-shadow:0 1px 4px #0005}
#status.dk{color:var(--ink);text-shadow:none}
#lock{z-index:40;color:#fff;align-items:center;justify-content:center;text-align:center;transition:transform .4s ease;cursor:grab;background:#0002;touch-action:none;user-select:none}
#lock.off{transform:translateY(-100%)}
#lock .t{font-size:96px;font-weight:800;line-height:1;letter-spacing:-3px}
#lock .d{font-size:18px;margin-top:8px;opacity:.9}
#lock .h{position:absolute;bottom:48px;font-size:14px;opacity:.8}
#home{padding:56px 22px 0}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px 8px;margin-top:20px}
.app{display:flex;flex-direction:column;align-items:center;gap:6px;color:#fff;font-size:12px;cursor:pointer;background:none;border:0;text-shadow:0 1px 3px #0006}
.ic{width:60px;height:60px;border-radius:19px;display:grid;place-items:center;font-size:28px;box-shadow:0 4px 12px #0003;transition:transform .15s}
.app:active .ic{transform:scale(.9)}
.widget{background:var(--card);backdrop-filter:blur(14px);border-radius:26px;padding:16px 18px;color:var(--ink)}
.widget b{font-size:40px;letter-spacing:-1px;font-weight:800}
.dock{position:absolute;left:14px;right:14px;bottom:26px;height:84px;border-radius:30px;background:#ffffff30;backdrop-filter:blur(16px);display:flex;justify-content:space-around;align-items:center}
#appwin{z-index:30;background:var(--panel);padding-top:42px;transform:scale(.85);opacity:0;pointer-events:none;border-radius:40px;transition:all .25s ease}
#appwin.on{transform:none;opacity:1;pointer-events:auto;border-radius:0}
.bar{padding:6px 20px 12px;font-size:28px;font-weight:800;letter-spacing:-1px}
.body{flex:1;overflow:auto;padding:0 18px 90px}
#homebar{position:absolute;bottom:8px;left:50%;width:130px;height:6px;margin-left:-65px;border-radius:3px;background:#fff;z-index:60;cursor:pointer;box-shadow:0 0 6px #0006}
#shade{z-index:55;background:#0b1d24ee;backdrop-filter:blur(20px);padding:56px 20px;color:#fff;transform:translateY(-100%);transition:transform .35s ease}
#shade.on{transform:none}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:14px 0}
.tile{padding:16px;border-radius:20px;background:#ffffff1c;border:0;color:#fff;text-align:left;font-size:15px;cursor:pointer}
.tile.on{background:var(--sea);color:#0d2a30}
.note{width:100%;min-height:300px;border:0;border-radius:20px;padding:16px;background:var(--card);color:var(--ink);font-size:17px;resize:none;outline:none}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.keys button,.btn{height:64px;border-radius:22px;border:0;font-size:24px;font-weight:600;background:var(--card);color:var(--ink);cursor:pointer}
.keys .op{background:var(--acc);color:#fff}.keys .w2{grid-column:span 2}
.btn{height:48px;font-size:16px;padding:0 20px}.btn.p{background:var(--acc);color:#fff}
#disp{font-size:54px;font-weight:800;text-align:right;padding:30px 6px 16px;overflow:hidden;white-space:nowrap}
.row{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:var(--card);border-radius:18px;margin-bottom:10px}
.sw{display:flex;gap:10px}.sw i{width:44px;height:44px;border-radius:14px;cursor:pointer;border:3px solid transparent}.sw i.on{border-color:var(--acc)}
.todo{display:flex;gap:10px;align-items:center;padding:14px 16px;background:var(--card);border-radius:18px;margin-bottom:8px;cursor:pointer}
.todo.done span{text-decoration:line-through;color:var(--mute)}
input.in{flex:1;height:48px;border-radius:16px;border:0;padding:0 14px;font-size:16px;background:var(--card);color:var(--ink);outline:none}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.lkb{position:absolute;bottom:40px;width:54px;height:54px;border-radius:50%;border:0;background:#0006;color:#fff;font-size:22px;cursor:pointer;backdrop-filter:blur(8px)}.lkb.on{background:#fff;color:#000}
#auth{z-index:42;background:#0b1d24ee;backdrop-filter:blur(22px);color:#fff;align-items:center;padding:70px 24px 24px;gap:14px;transform:translateY(100%);transition:transform .3s ease}
#auth.on{transform:none}
#auth h2{font-size:22px;font-weight:800}
#auth .sub{font-size:14px;opacity:.8;min-height:20px;text-align:center}
.dots{display:flex;gap:12px;height:16px}.dots i{width:14px;height:14px;border-radius:50%;border:2px solid #fff}.dots i.f{background:#fff}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:14px}
.pad button{height:72px;border-radius:50%;border:0;background:#ffffff1f;color:#fff;font-size:26px;font-weight:600;cursor:pointer}
.pat{display:grid;grid-template-columns:repeat(3,76px);gap:24px;touch-action:none;margin:10px 0}
.pat i{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;background:#ffffff14}.pat i:after{content:'';width:18px;height:18px;border-radius:50%;background:#fff8}.pat i.on{background:var(--sea)}.pat i.on:after{background:#0d2a30}
.body .pat i{background:#0d2a3018}.body .pat i:after{background:#0d2a3088}.body .pat i.on{background:var(--sea)}.body .pat i.on:after{background:#0d2a30}
.pw{width:100%;height:52px;border-radius:16px;border:0;padding:0 16px;font-size:18px;background:#ffffff1f;color:#fff;outline:none}
.shake{animation:sh .35s}@keyframes sh{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.scan{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;font-size:40px;border:3px solid var(--sea);animation:pl 1s infinite}@keyframes pl{50%{opacity:.35}}
.lk{position:absolute;bottom:90px;left:0;right:0;display:flex;justify-content:center;gap:10px;flex-wrap:wrap;padding:0 12px}
.seg{display:flex;gap:8px;flex-wrap:wrap}.seg button{flex:1;min-width:70px;height:44px;border:0;border-radius:14px;background:var(--card);color:var(--ink);font-size:15px;cursor:pointer}.seg button.on{background:var(--acc);color:#fff}
#toast{position:absolute;top:50px;left:20px;right:20px;z-index:70;padding:14px 16px;border-radius:18px;background:var(--sea);color:#0d2a30;font-weight:600;text-align:center;transform:translateY(-160px);transition:transform .3s}#toast.on{transform:none}
.sw{flex-wrap:wrap}
.bar{display:flex;align-items:center;gap:10px}
#abk{width:40px;height:40px;border:0;border-radius:14px;background:var(--card);color:var(--ink);font-size:26px;line-height:1;cursor:pointer}
#backbtn{position:absolute;bottom:3px;left:22px;z-index:60;border:0;border-radius:12px;width:46px;height:26px;background:#0007;color:#fff;font-size:13px;cursor:pointer}
.fing{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;width:100%}
.fing b{grid-column:1/-1;font-size:13px;opacity:.75;font-weight:600;margin-top:4px}
.fing button{height:40px;border:0;border-radius:12px;background:#ffffff1f;color:#fff;font-size:12px;cursor:pointer}
.body .fing button{background:var(--card);color:var(--ink)}
.grid{max-height:calc(100% - 300px);overflow-y:auto;scrollbar-width:none;align-content:start}
@keyframes up{50%{transform:translateY(-8px)}}
#lock .h{animation:up 1.6s infinite;text-align:center;line-height:1.6;font-size:15px}
#shade{background:#242424f2;overflow-y:auto;gap:14px;padding-bottom:80px}#shade>*{flex-shrink:0}
.cctop{display:flex;justify-content:flex-end;gap:16px}.cctop button{background:none;border:0;color:#fff;font-size:24px;cursor:pointer}
.cc{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:0}
.cc .card{background:#141414;border-radius:28px;padding:12px;color:#fff;grid-column:span 2}
.conn{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cc .pill{grid-column:span 2;height:54px;border:0;border-radius:30px;background:#2c2c2c;color:#fff;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}.cc .pill.g{background:#27c96b;color:#06210f}.pill small{font-size:13px}
.media{display:flex;flex-direction:column;justify-content:space-between;text-align:center;min-height:150px}.media .mt{color:#8a8a8a;font-size:15px;padding:0 6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.media .mc{display:flex;justify-content:space-around}.media .mc button{background:none;border:0;color:#aaa;font-size:24px;cursor:pointer}
.dat{display:flex;gap:10px;align-items:center}.dat .dot{width:48px;height:48px;border-radius:50%;background:#27c96b;display:grid;place-items:center;font-size:22px;flex:none}.dat b{font-size:13px}.st2{font-size:12px;color:#9a9a9a}
.sl{grid-row:span 2;border-radius:28px;background:#141414;position:relative;overflow:hidden;touch-action:none;cursor:ns-resize}.sl i{position:absolute;left:0;right:0;bottom:0;background:#fff}.sl span{position:absolute;bottom:14px;left:0;right:0;text-align:center;font-size:24px}
.cc .rt{aspect-ratio:1;border-radius:50%;border:0;background:#141414;color:#fff;font-size:26px;cursor:pointer;display:grid;place-items:center}.cc .conn .rt{background:#2c2c2c}.cc .rt.on{background:#2476ff}.cc .rt.w.on{background:#fff;color:#000}.cc .conn .rt.on{background:#2c2c2c;outline:2px solid #fff}
.cc.edit .rt{outline:2px dashed #ffffff66}.cc .rt.hid{opacity:.3}
#dim,#warm{position:absolute;inset:0;pointer-events:none;z-index:300}#dim{background:#000;opacity:0}#warm{background:#ff9a2e;mix-blend-mode:multiply;opacity:0;transition:opacity .4s}
.wall canvas,#lock canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;display:none}
#lock canvas{z-index:-1}
.sw i{position:relative}.sw i:nth-child(n+7):after{content:'3D';position:absolute;inset:0;display:grid;place-items:center;font:700 12px sans-serif;color:#fff;text-shadow:0 1px 3px #000a}
#drawer{z-index:33;background:#0b1d24f2;backdrop-filter:blur(20px);padding:56px 20px 20px;transform:translateY(100%);transition:transform .3s ease}
#drawer.on{transform:none}#drawer .grid{overflow:auto;flex:1;align-content:start;margin-top:0}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#0a2a8a">
<meta name="mobile-web-app-capable" content="yes">
</head>
<body>
<div id="phone">
  <div class="wall" id="wall"><canvas id="wlive"></canvas></div>
  <div id="status"><span id="stime">9:41</span><span id="sicons">📶 🔋</span></div>

  <div class="layer" id="home">
    <div class="widget"><div style="font-size:13px;color:var(--mute)" id="wdate"></div><b id="wtime"></b><div style="color:var(--mute);font-size:14px;margin-top:2px" id="wtasks">No open tasks</div></div>
    <div class="grid" id="grid"></div>
    <div class="dock" id="dock"></div>
  </div>

  <div class="layer" id="appwin"><div class="bar"><button id="abk" aria-label="Back">‹</button><span id="apptitle"></span></div><div class="body" id="appbody"></div></div>

  <div class="layer" id="shade">
    <div class="cctop"><button id="ccset" aria-label="Settings">⚙️</button><button id="ccedit" aria-label="Edit tiles">✎</button></div>
    <div class="tiles" id="tiles"></div>
    <button class="tile" id="lockbtn" style="width:100%;margin-bottom:14px">🔒 Lock phone</button>
    <div style="opacity:.75;font-size:14px" id="notifs"></div>
  </div>

  <div class="layer" id="drawer"><input class="in" id="dq" placeholder="Search apps" style="flex:none;width:100%;margin-bottom:16px"><div class="grid" id="dg"></div></div>
  <div class="layer" id="lock"><canvas id="llive"></canvas><div class="t" id="lt"></div><div class="d" id="ld"></div><div class="h" id="hint">⌃<br>Swipe up to unlock</div><button class="lkb" id="lkt" style="left:32px" aria-label="Flashlight">🔦</button><button class="lkb" id="lkc" style="right:32px" aria-label="Camera">📷</button></div>
  <div class="layer" id="auth"></div>
  <div id="toast" role="status"></div><div id="dim"></div><div id="warm"></div>
  <button id="backbtn" aria-label="Back" title="Back">◀</button>
  <div id="homebar" title="Home" role="button" aria-label="Home"></div>
</div>

<script>
const $=s=>document.getElementById(s);
const store={get(k,d){try{const v=localStorage.getItem('kelp:'+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem('kelp:'+k,JSON.stringify(v))}catch(e){}}};
const S={lock:store.get('lock',{type:'none',h:'',len:0,face:false,fp:false}),wall:store.get('wall',0),lwall:store.get('lwall',3),dark:store.get('dark',matchMedia('(prefers-color-scheme: dark)').matches),wifi:true,air:false,dnd:false,notes:store.get('notes',''),todos:store.get('todos',[{t:'Try the notification shade',d:false},{t:'Change the wallpaper',d:false}])};
const WALLS=['linear-gradient(160deg,#0f4c5c,#1fa390 55%,#a8e6cf)','linear-gradient(160deg,#2b1055,#7597de)','linear-gradient(160deg,#ff6b5a,#ffb88c 60%,#ffe3c2)','linear-gradient(180deg,#0b1d3a,#1c4e80 55%,#f6b17a)','linear-gradient(160deg,#2d3142,#6b7a8f 60%,#eef1f5)','linear-gradient(160deg,#14213d,#fca311)','linear-gradient(180deg,#02061a,#0a2a8a 70%,#2a6df4)','radial-gradient(circle at 50% 50%,#1b2a6b,#02030f 70%)','linear-gradient(160deg,#0b1d3a,#243b6b 60%,#4b2a7a)'];
let open=null,locked=true,sw=null;

function clock(){const d=new Date(),t=d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}).replace(/ ?[AP]M/i,''),ds=d.toLocaleDateString([],{weekday:'long',month:'long',day:'numeric'});
 ['stime','lt','wtime'].forEach(i=>$(i).textContent=t);$('ld').textContent=ds;$('wdate').textContent=ds;}
function theme(){document.documentElement.dataset.theme=S.dark?'dark':'light';$('wall').style.setProperty('--w',WALLS[S.wall]);$('lock').style.background='linear-gradient(#0002,#0002),'+WALLS[S.lwall];}
function wtasks(){const n=S.todos.filter(x=>!x.d).length;$('wtasks').textContent=n?n+' open task'+(n>1?'s':''):'All tasks done';}

const APPS=[
 {id:'notes',n:'Notes',i:'📝',c:'#ffd166',r:notes},
 {id:'calc',n:'Calculator',i:'🧮',c:'#ff6b5a',r:calc},
 {id:'tasks',n:'Tasks',i:'✅',c:'#7fd1b9',r:tasks},
 {id:'clock',n:'Stopwatch',i:'⏱️',c:'#9b8cff',r:clockApp},
 {id:'settings',n:'Settings',i:'⚙️',c:'#9aa8ad',r:settings},
 {id:'files',n:'Files',i:'📁',c:'#ffb703',r:files},
 {id:'link',n:'Phone link',i:'🔗',c:'#8ecae6',r:linkApp},
 {id:'cam',n:'Camera',i:'📷',c:'#ef476f',r:camApp},
 
 {id:'about',n:'About',i:'🏔️',c:'#4cc9f0',r:about}];
const DOCK=['notes','calc','settings'];
function tile(a){return `<button class="app" data-a="${a.id}"><div class="ic" style="background:${a.c}">${a.i}</div>${a.n}</button>`}
$('grid').innerHTML=APPS.filter(a=>!DOCK.includes(a.id)).map(tile).join('');
$('dock').innerHTML=DOCK.map(id=>tile(APPS.find(a=>a.id==id)).replace(/\s*<\/button>$/,m=>m).replace(/>[A-Za-z ]+<\/button>/,'></button>')).join('');
document.querySelectorAll('.app').forEach(b=>b.onclick=()=>launch(b.dataset.a));

function launch(id){const a=APPS.find(x=>x.id==id);open=id;subBack=null;$('apptitle').textContent=a.n;$('appbody').innerHTML='';$('appbody').style.cssText='';a.r($('appbody'));$('appwin').classList.add('on');$('status').classList.add('dk');}
function goHome(){$('drawer').classList.remove('on');if(LC){closeLC();return}if(locked)return;subBack=null;try{CAMST&&CAMST.getTracks().forEach(t=>t.stop())}catch(e){}if($('shade').classList.contains('on')){$('shade').classList.remove('on');return}
 if(open==='clock'&&sw)sw.run=false;open=null;$('appwin').classList.remove('on');$('status').classList.remove('dk');wtasks();}
$('homebar').onclick=goHome;

$('lockbtn').onclick=()=>{locked=true;open=null;['shade','appwin'].forEach(i=>$(i).classList.remove('on'));$('status').classList.remove('dk');$('lock').classList.remove('off')};
$('status').onclick=()=>{if(!locked){tiles();$('shade').classList.toggle('on')}};
document.addEventListener('keydown',e=>{if(e.key==='Escape')goHome()});

function notes(el){el.innerHTML='<textarea class="note" placeholder="Start typing. Notes save automatically."></textarea>';const t=el.firstChild;t.value=S.notes;t.oninput=()=>{S.notes=t.value;store.set('notes',t.value)}}

function calc(el){el.innerHTML='<div id="disp">0</div><div class="keys">'+['C','±','%','÷','7','8','9','×','4','5','6','−','1','2','3','+','0','.','='].map(k=>`<button class="${'÷×−+='.includes(k)?'op':''} ${k=='0'?'w2':''}">${k}</button>`).join('')+'</div>';
 let cur='0',acc=null,op=null,fresh=true;const d=$('disp'),show=()=>d.textContent=cur.length>10?(+cur).toPrecision(8):cur;
 const f={'+':(a,b)=>a+b,'−':(a,b)=>a-b,'×':(a,b)=>a*b,'÷':(a,b)=>b?a/b:NaN};
 el.querySelectorAll('.keys button').forEach(b=>b.onclick=()=>{const k=b.textContent;
  if(/\d/.test(k)){cur=fresh||cur==='0'?k:cur+k;fresh=false}
  else if(k==='.'){if(!cur.includes('.'))cur+='.';fresh=false}
  else if(k==='C'){cur='0';acc=op=null;fresh=true}
  else if(k==='±')cur=String(-cur);
  else if(k==='%')cur=String(cur/100);
  else{if(op&&!fresh){acc=f[op](acc,+cur);cur=String(+acc.toFixed(10))}else acc=+cur;op=k==='='?null:k;fresh=true}
  show()})}

function tasks(el){el.innerHTML='<div style="display:flex;gap:8px;margin-bottom:14px"><input class="in" id="ti" placeholder="Add a task"><button class="btn p" id="ta">Add</button></div><div id="tl"></div>';
 const draw=()=>{$('tl').innerHTML=S.todos.length?S.todos.map((x,i)=>`<div class="todo ${x.d?'done':''}" data-i="${i}"><span style="font-size:20px">${x.d?'✔️':'⭕'}</span><span style="flex:1">${x.t.replace(/</g,'&lt;')}</span><span data-x="${i}">✕</span></div>`).join(''):'<p style="color:var(--mute)">Nothing here. Add your first task above.</p>';
  $('tl').querySelectorAll('.todo').forEach(r=>r.onclick=e=>{const i=+r.dataset.i;if(e.target.dataset.x!==undefined)S.todos.splice(i,1);else S.todos[i].d=!S.todos[i].d;store.set('todos',S.todos);draw()})};
 const add=()=>{const v=$('ti').value.trim();if(v){S.todos.push({t:v,d:false});store.set('todos',S.todos);$('ti').value='';draw()}};
 $('ta').onclick=add;$('ti').onkeydown=e=>{if(e.key==='Enter')add()};draw()}

function clockApp(el){sw=sw||{ms:0,run:false,last:0,laps:[]};
 el.innerHTML='<div id="disp" style="text-align:center;font-size:64px"></div><div style="display:flex;gap:10px;justify-content:center;margin-bottom:16px"><button class="btn p" id="s1"></button><button class="btn" id="s2">Lap</button><button class="btn" id="s3">Reset</button></div><div id="laps"></div>';
 const fmt=m=>{const c=Math.floor(m/10)%100,s=Math.floor(m/1000)%60,mi=Math.floor(m/60000);return String(mi).padStart(2,'0')+':'+String(s).padStart(2,'0')+'.'+String(c).padStart(2,'0')};
 const draw=()=>{if(!$('disp'))return;$('disp').textContent=fmt(sw.ms);$('s1').textContent=sw.run?'Pause':'Start';$('laps').innerHTML=sw.laps.map((l,i)=>`<div class="row"><span>Lap ${sw.laps.length-i}</span><b>${fmt(l)}</b></div>`).join('')};
